name: Linux build (temporary)

# TEMPORARY: runs the Linux build on every push to feat/linux-build, because
# GitHub only lets release-build-linux.yml be dispatched by hand once it
# exists on main. Delete this file before the branch merges.

on:
  push:
    branches: [feat/linux-build]

jobs:
  linux:
    uses: ./.github/workflows/release-build-linux.yml
    with:
      version: '0.7.99'
