name: Release

# One-click release driver. Click "Run workflow", choose patch / minor /
# major, and:
#   1. Compute the next version from the latest `v*` git tag.
#   2. Build Windows + macOS in parallel with that version baked in.
#   3. Only if BOTH builds succeed: commit the CMakeLists.txt bump, tag,
#      push, and create a draft GitHub release with all artifacts attached.
#
# Failure modes do NOT touch main or create a tag. The "increment only on
# success" guarantee falls out of the job graph: the `publish` job needs
# both build jobs to pass.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which semver part to bump'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  # Serialize releases. Two simultaneous runs would race on the
  # CMakeLists.txt bump and the tag push; the second would always lose.
  # `cancel-in-progress: false` means the second click queues behind the
  # first instead of clobbering it.
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # required to push the bump commit + tag and create the release

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag:     ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 brings the full tag history. Default depth-1
          # would leave `git tag --list` empty and force the seed fallback
          # on every run.
          fetch-depth: 0

      - name: Compute next version
        id: compute
        shell: bash
        # Bumping rules:
        #   - Find highest existing `v*` tag by semver-aware sort.
        #   - Bump per the `bump` input (patch / minor / major).
        #   - If no tags exist yet, seed from CMakeLists.txt's VERSION so
        #     the first release ever can be cut without a manual tag.
        # Pre-release tags (`v0.6.0-rc1`) sort lower than `v0.6.0` and
        # would never be picked as the latest stable, which is what we want.
        run: |
          latest_tag=$(git tag --list 'v*' | sort -V | tail -n1 || true)
          if [[ -n "$latest_tag" ]]; then
              base="${latest_tag#v}"
              echo "Latest tag: $latest_tag (base $base)"
          else
              base=$(tr '\n' ' ' < CMakeLists.txt | sed -nE 's/.*project\(Crater[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p')
              if [[ -z "$base" ]]; then
                  echo "No tags and could not parse CMakeLists.txt VERSION; cannot seed." >&2
                  exit 1
              fi
              echo "No existing tags; seeding from CMakeLists.txt = $base"
          fi
          IFS='.' read -r major minor patch <<< "$base"
          case '${{ inputs.bump }}' in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          version="$major.$minor.$patch"
          tag="v$version"
          # Defensive: refuse if the computed tag already exists. Catches
          # the case where someone manually tagged ahead of CI; the bump
          # input is then wrong for the next release and we should stop
          # before clobbering anything.
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Computed tag $tag already exists. Pick a different bump." >&2
              exit 1
          fi
          {
              echo "version=$version"
              echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo ">>> next version: $version (tag $tag)"

  build-windows:
    name: Build Windows
    needs: version
    uses: ./.github/workflows/release-build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  build-macos:
    name: Build macOS
    needs: version
    uses: ./.github/workflows/release-build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Bump, tag, draft release
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history so the push isn't rejected as non-fast-forward in
          # the (rare but real) race where someone landed a commit on main
          # between this run starting and the publish job firing.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # No `name:` filter -> downloads every artifact produced in this
          # run, placing each under artifacts/<artifact-name>/. The release
          # step globs across `**/` to pick up Win + Mac files together.
          path: artifacts

      - name: Bump CMakeLists.txt
        # Identical edit to the one each build job made locally — we redo
        # it here on a fresh checkout so the commit captures only this
        # single change. Doing it via python avoids the BSD/GNU sed
        # multi-line replace mess.
        shell: bash
        env:
          NEW_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path('CMakeLists.txt')
          text = p.read_text()
          new = re.sub(
              r'(project\(Crater\s+VERSION\s+)\d+\.\d+\.\d+',
              r'\g<1>' + os.environ['NEW_VERSION'],
              text, count=1)
          if new == text:
              raise SystemExit('CMakeLists.txt VERSION not replaced')
          p.write_text(new)
          PY

      - name: Commit, tag, push
        env:
          TAG:     ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        # Identity: the GitHub-blessed bot account. Using a personal
        # account would require a PAT in secrets; the bot identity works
        # with the default GITHUB_TOKEN.
        # The annotated tag (`-a`) means `git describe` returns the tag
        # name on the commit; a lightweight tag would silently degrade to
        # the SHA. softprops/action-gh-release tolerates either, but the
        # rest of the toolchain (and `git log --decorate`) is cleaner with
        # annotated tags.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt
          git commit -m "release $TAG"
          git tag -a "$TAG" -m "Crater $TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Crater ${{ needs.version.outputs.tag }}
          # Draft so the human can eyeball the four artifacts before users
          # see them. Switch to `draft: false` to ship straight to public.
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/Crater-*-win64.zip
            artifacts/**/Crater-Setup-*.exe
            artifacts/**/Crater-*-macos.zip
            artifacts/**/Crater-*-macos.dmg
