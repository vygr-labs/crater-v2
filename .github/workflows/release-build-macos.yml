name: Build macOS (reusable)

# Reusable build for the macOS platform. Called by release.yml (the
# orchestrator). Not callable directly — there is no workflow_dispatch
# trigger here on purpose. Use the parent Release workflow.
#
# Contract:
#   inputs.version  -- semver (no leading 'v') used to name artifacts and
#                      pinned into CMakeLists.txt's VERSION before building
#                      so the binary itself reports the same version the
#                      ZIP / DMG filenames advertise.
#
# Output: a single workflow artifact `crater-macos-<version>` containing
#   the portable ZIP of crater.app and the DMG installer. The orchestrator
#   picks it up via actions/download-artifact and attaches both to the
#   GitHub release.

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver to build (no leading v)'
        type: string
        required: true
  # workflow_dispatch makes the workflow appear in the Actions UI so it
  # can be triggered individually for debugging — useful when a Windows-
  # specific or macOS-specific issue means you don't want to re-run the
  # full release orchestrator just to iterate on one platform.
  # Required version input keeps the workflow's contract uniform: every
  # invocation supplies a version string, so the CMakeLists.txt pin step
  # below doesn't need any conditional logic.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for this debug build (e.g. 0.6.0-test)'
        type: string
        required: true

jobs:
  build:
    name: Build, package
    # macos-14 = Apple Silicon (M1). Qt's clang_64 kit is universal so the
    # produced .app runs on Intel too.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin CMakeLists.txt to v${{ inputs.version }}
        # Local-only edit: bake the orchestrator-chosen version into the
        # source before configure so the binary's reported version matches
        # the artifact name. Same edit is committed to main by the
        # orchestrator's publish job after both builds succeed.
        # Python because portable multi-line regex replace in BSD sed is
        # genuinely painful and python3 ships on every macOS runner.
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path('CMakeLists.txt')
          text = p.read_text()
          new = re.sub(
              r'(project\(Crater\s+VERSION\s+)\d+\.\d+\.\d+',
              r'\g<1>' + os.environ['NEW_VERSION'],
              text, count=1)
          if new == text:
              raise SystemExit('CMakeLists.txt VERSION not replaced')
          p.write_text(new)
          PY
          echo ">>> CMakeLists.txt pinned to $NEW_VERSION"

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'mac'
          target: 'desktop'
          # Universal kit — produces a .app that runs on both arm64 and x64.
          arch: 'clang_64'
          modules: 'qtmultimedia qtpdf qtwebsockets'
          cache: true
          extra: '--base https://download.qt.io/'
          # Pinned aqtinstall fork — the vanilla pypi aqt 3.3.x strips
          # Qt6*PrivateConfig.cmake from binary installs, which makes
          # `find_package(Qt6 ... GuiPrivate)` fail at configure. This
          # fork's HEAD includes the fix that ships private CMake configs
          # alongside the public ones. Required for NdiRenderer's
          # `<rhi/qrhi.h>` include path on every Qt version we've tried
          # (6.5, 6.8, 6.11). Drop this pin once aqtinstall ships a release
          # with the private-archive fix.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Cache bibles.sqlite
        uses: actions/cache@v4
        with:
          path: packaging/bibles.sqlite
          key: bibles-sqlite-data-v1-${{ runner.os }}

      - name: Download qtbase source for private headers
        # The Qt 6.8 LTS binary install ships QtGui.framework's compiled
        # symbols (including QRhi) but NOT the private headers that
        # declare them. NdiRenderer needs `<rhi/qrhi.h>` to compile.
        # qtbase is the only Qt 6.8 submodule we need source for, and
        # it IS distributed via download.qt.io (unlike qtpdf, which is
        # absent from that channel — see commit history for the
        # full-source-build attempts that hit that wall).
        # We download just qtbase source (~150 MB), use it for headers,
        # and link against the binary library. ABI matches by
        # construction because both halves are Qt 6.8.2.
        shell: bash
        run: |
          QT_VER='6.8.2'
          SRC_TARBALL="qtbase-everywhere-src-${QT_VER}.tar.xz"
          SRC_URL="https://download.qt.io/archive/qt/${QT_VER%.*}/${QT_VER}/submodules/${SRC_TARBALL}"
          echo "Downloading $SRC_URL"
          curl -fSL --retry 3 -o "$RUNNER_TEMP/${SRC_TARBALL}" "$SRC_URL"
          mkdir -p "$RUNNER_TEMP/qt-src"
          tar -xf "$RUNNER_TEMP/${SRC_TARBALL}" -C "$RUNNER_TEMP/qt-src"
          QT_SRC_DIR="$RUNNER_TEMP/qt-src/qtbase-everywhere-src-${QT_VER}"
          if [[ ! -f "$QT_SRC_DIR/src/gui/rhi/qrhi.h" ]]; then
              echo "ERROR: qrhi.h missing from qtbase source tarball" >&2
              ls "$QT_SRC_DIR/src/gui" 2>&1 | head -20 >&2
              exit 1
          fi
          echo "QT_PRIV_SRC_DIR=$QT_SRC_DIR" >> "$GITHUB_ENV"
          echo ">>> qtbase source extracted: $QT_SRC_DIR"
          echo ">>> qrhi.h confirmed at:    $QT_SRC_DIR/src/gui/rhi/qrhi.h"

      - name: Synthesize Qt6GuiPrivate CMake config (source headers)
        # Wire Qt6::GuiPrivate to the source-tree private headers we
        # just extracted. The binary QtGui.framework provides the
        # linkable QRhi symbols; the source tarball provides the
        # declarations. Same Qt 6.8.2 version on both sides = ABI match.
        # Drop this step once Qt's binary distribution starts bundling
        # private headers (Qt 6.11 already does, but its macOS floor
        # is 14 which excludes our Monterey users).
        shell: bash
        run: |
          PRIV_DIR="$QT_ROOT_DIR/lib/cmake/Qt6GuiPrivate"
          mkdir -p "$PRIV_DIR"
          cat > "$PRIV_DIR/Qt6GuiPrivateConfig.cmake" <<EOF
          set(Qt6GuiPrivate_VERSION "6.8.2")
          set(Qt6GuiPrivate_FOUND TRUE)
          if(NOT TARGET Qt6::GuiPrivate)
              add_library(Qt6::GuiPrivate INTERFACE IMPORTED)
              # Source-tree layout: qtbase/src/gui/{,rhi/}
              set_target_properties(Qt6::GuiPrivate PROPERTIES
                  INTERFACE_INCLUDE_DIRECTORIES "$QT_PRIV_SRC_DIR/src/gui;$QT_PRIV_SRC_DIR/src/gui/rhi"
                  INTERFACE_LINK_LIBRARIES "Qt6::Gui"
              )
          endif()
          EOF
          cat > "$PRIV_DIR/Qt6GuiPrivateConfigVersion.cmake" <<EOF
          set(PACKAGE_VERSION "6.8.2")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          set(PACKAGE_VERSION_EXACT TRUE)
          EOF
          echo ">>> Wrote $PRIV_DIR/Qt6GuiPrivateConfig.cmake"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Run release script
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER:   sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          bash ./scripts/release.sh \
            --qt-dir "$QT_ROOT_DIR" \
            --version '${{ inputs.version }}' \
            --clean

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: List artifacts
        shell: bash
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crater-macos-${{ inputs.version }}
          path: |
            dist/Crater-*-macos.zip
            dist/Crater-*-macos.dmg
          if-no-files-found: error
          retention-days: 14
